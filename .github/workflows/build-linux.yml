name: aseprite

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, leave empty for latest"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Wrapper Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            clang \
            libc++-dev \
            libc++abi-dev \
            cmake \
            ninja-build \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            unzip \
            curl

      - name: Get Aseprite Source Code
        run: |
          # Clonar el código fuente real de Aseprite
          git clone --recursive https://github.com/aseprite/aseprite.git
          cd aseprite

          # Cambiar a versión específica si se solicitó
          if [ -n "${{ github.event.inputs.version }}" ]; then
            git fetch --tags
            git checkout "${{ github.event.inputs.version }}"
            git submodule update --init --recursive
          fi

      - name: Build
        id: build
        shell: bash
        run: |
          # Trabajar dentro de la carpeta del código fuente
          cd aseprite

          # Descargar Skia precompilado oficial (Versión m124)
          mkdir -p skia
          cd skia
          curl -LO https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip Skia-Linux-Release-x64.zip
          cd ..

          # Configurar CMake usando Clang y libc++ con RUTAS ABSOLUTAS
          export CC=clang
          export CXX=clang++
          mkdir build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libc++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$GITHUB_WORKSPACE/aseprite/skia \
            -DSKIA_LIBRARY_DIR=$GITHUB_WORKSPACE/aseprite/skia/out/Release-x64 \
            -DSKIA_LIBRARY=$GITHUB_WORKSPACE/aseprite/skia/out/Release-x64/libskia.a \
            -G Ninja \
            ..

          # Compilar Aseprite
          ninja aseprite
          cd ..

          # Crear la carpeta de salida y empaquetar
          mkdir -p ../github
          tar -czf ../github/aseprite-linux.tar.gz -C build/bin .

          # Obtener la versión para el artefacto
          VERSION=$(git describe --tags --always)
          echo "ASEPRITE_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-${{ steps.build.outputs.ASEPRITE_VERSION }}
          path: github/
          if-no-files-found: error
