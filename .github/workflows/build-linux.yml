name: aseprite

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, leave empty for latest"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            clang \
            cmake \
            ninja-build \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            unzip \
            curl

      - name: Build
        id: build
        shell: bash
        run: |
          # 1. Cambiar a versión específica si se solicitó
          if [ -n "${{ github.event.inputs.version }}" ]; then
            git fetch --tags
            git checkout "${{ github.event.inputs.version }}"
            git submodule update --init --recursive
          fi

          # 2. Descargar Skia precompilado para Linux (Obligatorio para Aseprite)
          mkdir -p skia
          cd skia
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m119-0a2154c5e3/Skia-Linux-Release-x64-libstdc++.zip
          unzip skia.zip
          cd ..

          # 3. Configurar CMake
          mkdir build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=../skia \
            -DSKIA_LIBRARY_DIR=../skia/out/Release-x64 \
            -DSKIA_LIBRARY=../skia/out/Release-x64/libskia.a \
            -G Ninja \
            ..

          # 4. Compilar Aseprite
          ninja aseprite
          cd ..

          # 5. Crear la carpeta de salida y empaquetar
          mkdir -p github
          tar -czf github/aseprite-linux.tar.gz -C build/bin .

          # Obtener la versión para el artefacto
          VERSION=$(git describe --tags --always)
          echo "ASEPRITE_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-${{ steps.build.outputs.ASEPRITE_VERSION }}
          path: github/
          if-no-files-found: error
